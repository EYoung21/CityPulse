# PhillyPulse — Philadelphia, PA
# This is the reference config; values migrated from the root config.yaml.

city:
  name: "Philadelphia"
  short: "PHL"
  slug: "philly"
  domain: "phlpulse.com"
  region: "Philadelphia, PA"
  tagline: "Google Maps tells you the fastest way. PhillyPulse tells you the safest."

map:
  center_lat: 39.9526
  center_lng: -75.1652
  default_zoom: 12

# Greater Philadelphia metro: Philadelphia city + Delaware, Chester,
# Montgomery, and Bucks counties. The original Philly-only bounds
# (lng_min: -75.30) was rejecting every geocoded incident from the
# DelCo/ChesCo/MontCo scanner feeds — Swarthmore (-75.35), Media
# (-75.39), Chester (-75.36), West Chester (-75.60), Pottstown
# (-75.65) all sit west of the old western edge, so suburban dispatch
# was being captured + transcribed but the resulting addresses fell
# outside the bbox and were thrown away.
#
# `, PA` (rather than `, Philadelphia, PA`) lets Nominatim resolve the
# city/borough from the street itself, so "1234 Chester Pike" becomes
# "1234 Chester Pike, PA" and resolves into Delaware County instead
# of being forced into Philadelphia where it doesn't exist.
geocode:
  viewbox: "-75.70,39.78,-74.85,40.30"
  bounds:
    lat_min: 39.78
    lat_max: 40.30
    lng_min: -75.70
    lng_max: -74.85
  suffix: ", PA"

feeds:
  - { feed_id: "4603",  label: "PPD Citywide" }
  - { feed_id: "17310", label: "PPD Central" }
  - { feed_id: "21297", label: "PPD East" }
  - { feed_id: "45495", label: "PPD Northeast" }
  - { feed_id: "18836", label: "PPD Northwest" }
  - { feed_id: "15102", label: "PPD South" }
  - { feed_id: "15195", label: "PPD Southwest/West" }
  - { feed_id: "34250", label: "PFD South Fire/Medics" }
  - { feed_id: "15747", label: "PFD North Fire" }
  - { feed_id: "44308", label: "SEPTA Transit Police" }
  - { feed_id: "36323", label: "Delaware Co Police Dispatch" }
  - { feed_id: "46438", label: "DelCo Fire/EMS - Countywide Ops" }
  # Per-sector DelCo PD feeds (P25 Phase II trunked dispatch, one per
  # patrol sector). The countywide 36323 interleaves all 7 sectors so
  # transcripts are noisy and easy to mis-attribute geographically; the
  # per-sector feeds are cleaner and let the LLM bias geocoding to the
  # right cluster of municipalities. Sector definitions per the
  # Delaware County PA RadioReference wiki:
  #   Sector 1 → Brookhaven, Aston, Marcus Hook, Trainer, Upper/Lower
  #              Chichester, Bethel, Parkside, Upland, Chester Twp
  #              (south DelCo / Delaware River industrial belt).
  #   Sector 2 → Swarthmore Boro (incl. Rutledge), Media Boro, Nether
  #              Providence, Springfield Twp, Morton, Marple Twp,
  #              Newtown Twp, Upper Providence, Penn State Brandywine.
  #              **This is the feed that covers Swarthmore College + the
  #              Springfield/Media/Marple corridor the user asked for.**
  #   Sector 3 → Chester City only (its own sector since the city
  #              generates the bulk of DelCo call volume).
  #   Sector 4 → Lansdowne, Aldan, Clifton Heights, East Lansdowne,
  #              Yeadon, Darby Boro, Colwyn, Sharon Hill, Folcroft,
  #              Collingdale, Darby Twp (close-in inner suburbs along
  #              the Market-Frankford / Baltimore Pike corridor).
  #   Sector 5 → Eddystone, Ridley Twp, Glenolden, Prospect Park,
  #              Norwood, Tinicum, Ridley Park (river belt south of
  #              Sector 4, around Philadelphia International Airport).
  #   Sector 6 → Upper Darby Twp + Millbourne Boro (between Philly and
  #              the Main Line on the Market-Frankford El).
  #   Sector 7 → Haverford Twp (Havertown), Radnor Twp (Wayne, Villanova,
  #              Rosemont, St Davids), Villanova University — the Main
  #              Line / Bryn Mawr-adjacent corridor. Bryn Mawr borough
  #              itself is in Lower Merion (MontCo); Lower Merion PD
  #              runs encrypted DMR, so Sector 7 + MontCo Fire West
  #              (18335) is the closest unencrypted coverage we can get.
  - { feed_id: "46436", label: "DelCo PD Sector 1 (Brookhaven/Aston/Chichester/Marcus Hook)" }
  - { feed_id: "46437", label: "DelCo PD Sector 2 (Swarthmore/Media/Springfield/Marple/Newtown)" }
  - { feed_id: "46444", label: "DelCo PD Sector 3 (Chester City)" }
  - { feed_id: "46443", label: "DelCo PD Sector 4 (Lansdowne/Yeadon/Sharon Hill/Folcroft/Darby)" }
  - { feed_id: "46442", label: "DelCo PD Sector 5 (Ridley/Eddystone/Glenolden/Prospect Park/Norwood/Tinicum)" }
  - { feed_id: "46441", label: "DelCo PD Sector 6 (Upper Darby/Millbourne)" }
  - { feed_id: "46440", label: "DelCo PD Sector 7 (Haverford/Radnor/Main Line)" }
  - { feed_id: "46435", label: "DelCo Fire East (Upper Darby/Lansdowne corridor)" }
  - { feed_id: "24104", label: "Chester Co Law Enforcement Dispatch" }
  - { feed_id: "10489", label: "MontCo Fire and EMS - East" }
  - { feed_id: "25767", label: "MontCo Police, Fire and EMS - Region 3" }
  # MontCo 18335 broadcasts the entire county Fire/EMS trunk — countywide
  # dispatch + all regions + Event channels. Lower Merion PD itself is
  # fully encrypted, so this is the only way we hear anything from
  # Bryn Mawr / Ardmore / Wynnewood / Bala Cynwyd / Narberth.
  - { feed_id: "18335", label: "MontCo Fire/EMS All-Regions (Lower Merion/Bryn Mawr/Main Line)" }

tuning:
  # Whisper "initial_prompt": biases the acoustic model toward names it
  # would otherwise mis-hear. We list both Philadelphia neighborhoods AND
  # the surrounding counties' towns/landmarks because the same backend
  # transcribes DelCo, ChesCo, MontCo, and Bucks scanner feeds.
  initial_prompt: >-
    Greater Philadelphia PA dispatch (Philadelphia, Delaware County,
    Chester County, Montgomery County, Bucks County). PPD districts 1-26.
    Units: Charlie, David, Edward, Frank, King, Mary, Nora.
    Philly: Broad St, Market St, Kensington Ave, Germantown Ave, Roosevelt
    Blvd, Girard Ave, Spring Garden, Fairmount, University City, Center
    City, North Philly, South Philly, West Philly, Fishtown, Manayunk,
    Chestnut Hill, Mt Airy, Olney, Frankford.
    Delaware County: Chester, Upper Darby, Media, Swarthmore, Wallingford,
    Rutledge, Rose Valley, Nether Providence, Springfield, Drexel Hill,
    Lansdowne, Yeadon, Darby, Folcroft, Ridley, Sharon Hill, Aston,
    Brookhaven, Marcus Hook, Havertown, Haverford, Brookline, Manoa,
    Broomall, Newtown Square, Wayne, Villanova, Rosemont, St Davids,
    Radnor, Bryn Mawr (PA), Chester Pike, MacDade Blvd, Baltimore Pike,
    Providence Road, West Chester Pike, Lancaster Avenue, Eagle Road,
    Darby Road, Township Line.
    Chester County: West Chester, Coatesville, Phoenixville, Downingtown,
    Kennett Square, Exton, Paoli, Berwyn, Tredyffrin, Lincoln Highway,
    Route 30.
    Montgomery County (Lower Merion / Main Line): Bryn Mawr, Ardmore,
    Wynnewood, Narberth, Bala Cynwyd, Cynwyd, Penn Valley, Gladwyne,
    Merion Station, Belmont Hills, Lower Merion, City Avenue, Montgomery
    Avenue, Lancaster Avenue, Old Lancaster Road.
    Montgomery County (other): Norristown, Pottstown, King of Prussia,
    Lansdale, Plymouth Meeting, Conshohocken, Cheltenham, Souderton.
    Bucks County: Doylestown, Levittown, Bensalem, Bristol, Newtown.
    Hospitals: Temple, Jefferson, Penn, Hahnemann, Einstein, Crozer,
    Riddle, Bryn Mawr Hospital, Paoli Hospital, Lankenau, Abington,
    Main Line Health, Bryn Mawr Rehab.
    Colleges: Swarthmore College, Bryn Mawr College, Haverford College,
    Villanova, Penn, Drexel, Temple, St Joseph's, La Salle, Eastern,
    Cabrini, Rosemont College.
    Phrases: responding, en route, on location, in service, 10-4, copy,
    radio, highway, shots fired, person with a gun, robbery in progress,
    assist officer. Short dispatch. Numbers spoken separately.
  llm_local_context: >-
    Greater Philadelphia PA metro: Philadelphia city plus Delaware, Chester,
    Montgomery, and Bucks counties. Prefer the county implied by the scanner
    feed (PPD citywide vs DelCo sectors vs MontCo/Chester) over forcing
    “Philadelphia” when the street name exists in the suburbs.
    Philadelphia: Center City, North/South/West Philly, Kensington, Fishtown,
    Manayunk, Germantown, University City, neighborhoods along Broad, Market,
    Girard, Roosevelt Blvd, Schuylkill Expressway I-76, Vine St Expy.
    Delaware County: Upper Darby, Media, Springfield, Swarthmore, Chester,
    Ridley, Lansdowne, Yeadon, Havertown/Haverford Twp, Drexel Hill, Newtown
    Square, Wayne, Villanova, Radnor, Rosemont; Chester Pike, MacDade,
    Baltimore Pike, Providence Rd, West Chester Pike, Township Line.
    Chester County: West Chester, Coatesville, Exton, Downingtown, Kennett,
    Paoli, Great Valley, Route 30.
    Montgomery County: Norristown, King of Prussia, Plymouth Meeting,
    Conshohocken, Lower Merion, Bryn Mawr, Ardmore, Narberth, Wynnewood,
    Lansdale, Pottstown; City Ave, Lancaster Ave, Germantown Pike.
    Bucks: Bensalem, Bristol, Doylestown, Levittown.
    Hospitals: Temple, Jefferson, Penn, Einstein, Crozer, Riddle, Bryn Mawr
    Hospital, Lankenau, Paoli, Abington, Main Line Health.
    Colleges: Penn, Drexel, Temple, Villanova, Swarthmore, Bryn Mawr,
    Haverford, St Joe’s, La Salle.
