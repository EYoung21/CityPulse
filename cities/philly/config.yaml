tuning:
  initial_prompt: >-
    Philadelphia PA police radio dispatch. PPD districts 1-26. Units: Charlie,
    David, Edward, Frank, King, Mary, Nora. Locations: Broad St, Market St,
    Kensington Ave, Germantown Ave, Roosevelt Blvd, Girard Ave, Spring Garden,
    Fairmount, University City, Center City, North Philly, South Philly, West
    Philly, Fishtown, Manayunk, Chestnut Hill, Mt Airy, Olney, Frankford.
    Hospitals: Temple, Jefferson, Penn, Hahnemann, Einstein. Phrases: responding,
    en route, on location, in service, 10-4, copy, radio, highway, shots fired,
    person with a gun, robbery in progress, assist officer. Short dispatch.
    Numbers spoken separately.
