# PhillyPulse — secondary transcriber (suburb feeds)
#
# This file mirrors cities/philly/config.yaml but only carries the
# DelCo per-sector + MontCo/Chester suburban feeds. It runs under a
# separate systemd service, `pulse-live@philly2.service`, on the Lambda
# GPU box so the two services share Whisper inference across their own
# worker pools instead of fighting one queue.
#
# Both services emit `city: "philly"` to the ingest endpoint — the slug
# below is intentionally "philly", and city_registry.py merges feed
# lists when it encounters more than one config file pointing at the
# same slug. From the API/frontend's perspective there is one city.
#
# Why split: Philly's Greater Metro footprint covers Philadelphia +
# DelCo (7 sectors) + ChesCo + MontCo (3 trunks). 24 simultaneous
# Broadcastify streams overwhelmed a single Whisper worker pool — see
# `[Status] feeds=24/24 queue=2847 uptime=1051m` in the diagnostics
# log. Splitting ~12/12 with two worker pools brings the queue depth
# in line with NYC/SF (queue=0).

city:
  name: "Philadelphia"
  short: "PHL"
  slug: "philly"
  domain: "phlpulse.com"
  region: "Greater Philadelphia, PA (DelCo / ChesCo / MontCo suburban feeds)"
  tagline: "Google Maps tells you the fastest way. PhillyPulse tells you the safest."

map:
  center_lat: 39.9526
  center_lng: -75.1652
  default_zoom: 12

# Same metro bounds as the primary Philly config so suburban
# addresses pass geocode validation.
geocode:
  viewbox: "-75.70,39.78,-74.85,40.30"
  bounds:
    lat_min: 39.78
    lat_max: 40.30
    lng_min: -75.70
    lng_max: -74.85
  suffix: ", PA"

transcriber:
  num_workers: 5
  max_queue: 300
  max_segment_lag_sec: 180

# Match cities/philly/config.yaml — the metro's two shards run the same
# VAD profile so the throughput characteristics stay aligned. If you
# loosen this here, also loosen it on the primary; we don't want one
# half of Philly producing noticeably more transcripts than the other.
vad_and_silence:
  vad_aggressiveness: 2
  min_speech_seconds: 1.5
  silence_limit: 2.2

# ── PHILLY SUBURB FEEDS ────────────────────────────────────────────
# DelCo per-sector trunks: cleaner-than-countywide audio that lets
# the LLM bias geocoding to the right cluster of municipalities. See
# cities/philly/config.yaml for the full per-sector geographic key.
feeds:
  - { feed_id: "46436", label: "DelCo PD Sector 1 (Brookhaven/Aston/Chichester/Marcus Hook)" }
  - feed_id: "46437"
    label: "DelCo PD Sector 2 (Swarthmore/Media/Springfield/Marple/Newtown)"
    jurisdiction_hint: "Delaware County Sector 2 (Swarthmore, Media, Springfield, Marple, Nether Providence, Newtown Twp)."
    geocode_bounds: "-75.45,39.86,-75.30,39.98"
  - { feed_id: "46444", label: "DelCo PD Sector 3 (Chester City)" }
  - { feed_id: "46443", label: "DelCo PD Sector 4 (Lansdowne/Yeadon/Sharon Hill/Folcroft/Darby)" }
  - { feed_id: "46442", label: "DelCo PD Sector 5 (Ridley/Eddystone/Glenolden/Prospect Park/Norwood/Tinicum)" }
  - { feed_id: "46441", label: "DelCo PD Sector 6 (Upper Darby/Millbourne)" }
  - { feed_id: "46440", label: "DelCo PD Sector 7 (Haverford/Radnor/Main Line)" }
  - { feed_id: "46435", label: "DelCo Fire East (Upper Darby/Lansdowne corridor)" }
  - { feed_id: "24104", label: "Chester Co Law Enforcement Dispatch" }
  - { feed_id: "10489", label: "MontCo Fire and EMS - East" }
  - { feed_id: "25767", label: "MontCo Police, Fire and EMS - Region 3" }
  # MontCo 18335 broadcasts the entire county Fire/EMS trunk — countywide
  # dispatch + all regions + Event channels. Lower Merion PD itself is
  # fully encrypted, so this is the only way we hear anything from
  # Bryn Mawr / Ardmore / Wynnewood / Bala Cynwyd / Narberth.
  - { feed_id: "18335", label: "MontCo Fire/EMS All-Regions (Lower Merion/Bryn Mawr/Main Line)" }

tuning:
