# Per-city prefilter overrides for Dallas.
# Extends philly_pulse/data/prefilter_default.yaml.

noise_patterns:
  - "(?i)^(unit|car|adam|baker|charlie|david|edward|frank|george|king)\\s*\\d+\\s+(10[- ]?8|10[- ]?7|in service|out of service)[\\s.,!?]*$"

keep_keywords:
  - signal 19      # Shooting (DPD).
  - signal 20      # Stabbing.
  - signal 27      # Major disturbance.
  - signal 31      # Robbery in progress.
  - signal 33      # Crime against person.
  - signal 34      # Burglary in progress.
  - signal 40      # Major accident with injuries.
  - signal 63      # Disturbance / domestic.
  - shots fired
  - person with a gun
