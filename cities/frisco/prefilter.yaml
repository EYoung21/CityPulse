# Per-city prefilter overrides for Frisco / Collin County.
# Extends philly_pulse/data/prefilter_default.yaml.

noise_patterns:
  - "(?i)^(unit|car|adam|baker|charlie|david|edward|frank|george|king)\\s*\\d+\\s+(10[- ]?8|10[- ]?7|in service|out of service)[\\s.,!?]*$"

keep_keywords:
  - shots fired
  - person with a gun
  - major accident
  - pursuit
  - foot pursuit
  - robbery in progress
  - burglary in progress
  - domestic in progress
  - disturbance with weapon
