city:
  name: "New York City"
  slug: "nyc"
  short: "NYC"
  domain: "newyorkcitypulse.com"

# Shorter speech segments + slightly shorter silence tail → more segments
# queued for FDNY-style traffic (NYPD precinct audio is mostly encrypted).
vad_and_silence:
  vad_aggressiveness: 1
  min_speech_seconds: 1.15
  silence_limit: 2.2

# Extra Whisper worker threads on Lambda help drain the queue after bursts.
transcriber:
  num_workers: 5

map:
  center_lat: 40.7128
  center_lng: -74.0060
  default_zoom: 11

# Notify NYC is the only free, official near-real-time citywide source. It
# covers confirmed significant events, not every 911 call. Routine NYPD radio
# is encrypted and the public NYPD/FDNY call datasets are delayed.
public_sources:
  - { source_id: "notify-nyc", label: "Notify NYC" }

geocode:
  viewbox: "-74.26,40.49,-73.70,40.92"
  bounds: "-74.26,40.49,-73.70,40.92"
  suffix: ", New York, NY"

tuning:
  initial_prompt: >-
    New York City fire and EMS radio dispatch. FDNY borough dispatchers in
    Manhattan, Brooklyn, Queens, Bronx, Staten Island. Hatzolah EMS dispatch.
    Box numbers, 10-codes (10-75 working fire, 10-77 high-rise fire, 10-45
    fatality, 10-92 unfounded, 10-84 on scene). Engine companies (Engine 1
    through Engine 332), Ladder companies (Ladder 1 through Ladder 175),
    Battalion chiefs (Battalion 1 through 58), Squad and Rescue companies.
    EMS units (Boro 1, 2, 3, 4, 5; Conditions car). FDNY tour numbers.
    Phrases: probable cause, all hands, working fire, second alarm, third
    alarm, 10-75, 10-77, taking the air, taking up, unfounded, transmit a
    second source, AFA automatic fire alarm, gas leak, person trapped,
    auto accident with injuries, MVA pin in, jumper, EDP emotionally
    disturbed person, cardiac arrest, CFR-D certified first responder,
    BLS, ALS, transport to. Plus NYPD: precincts 1 through 123, central,
    responding, 10-4, 10-13, 10-85, shots fired, robbery, assault, in
    pursuit, on the scene. Five boroughs: Manhattan, Brooklyn, Queens,
    Bronx, Staten Island. Manhattan neighborhoods: Harlem, East Harlem,
    Upper West Side, Upper East Side, Midtown, Chelsea, Greenwich Village,
    East Village, Lower East Side, Tribeca, SoHo, Chinatown, Financial
    District, Hell's Kitchen, Murray Hill, Gramercy, Washington Heights,
    Inwood. Brooklyn: Bed-Stuy, Brownsville, East New York, Crown Heights,
    Flatbush, Bushwick, Williamsburg, Park Slope, Sunset Park, Bay Ridge,
    Coney Island, Canarsie, Boro Park, Midwood. Bronx: South Bronx, Mott
    Haven, Fordham, Pelham Bay, Tremont, Kingsbridge. Queens: Jamaica,
    Flushing, Astoria, Long Island City, Far Rockaway, Jackson Heights.
    Staten Island: St George, Tottenville, New Dorp. Roads: Broadway, FDR
    Drive, BQE, Cross Bronx, Grand Central, LIE, Henry Hudson, West Side
    Highway, Belt Parkway. Hospitals: Bellevue, Mount Sinai, NYU Langone,
    Columbia Presbyterian, Lincoln, Jacobi, Kings County, Maimonides,
    Elmhurst, Methodist, Coney Island Hospital, Staten Island University.
    Short dispatch. Numbers spoken separately.
  llm_local_context: >-
    Most NYC traffic on this pipeline is FDNY fire and Hatzolah EMS
    dispatch (NYPD precinct dispatch is largely encrypted in 2026).
    Common FDNY incident types: working fires, AFA automatic fire alarms,
    gas leaks, person trapped, MVAs with injuries (pin in / extrication),
    CFR-D and BLS/ALS medical calls, EDP holds, cardiac arrests, water
    rescues. EMS units are organized by Boro 1–5; FDNY Engines 1–332,
    Ladders 1–175, Battalions 1–58, Squads, Rescues. Five boroughs:
    Manhattan, Brooklyn, Queens, Bronx, Staten Island. Prefer the
    borough actually named on the radio (or implied by the dispatch
    channel — FDNY Bronx Dispatch ⇒ Bronx, FDNY Queens Dispatch ⇒
    Queens, etc.) over defaulting to "Manhattan." If the channel is
    Brooklyn Fire & Hatzolah EMS, the location is Brooklyn unless
    explicitly stated otherwise. NYPD precincts 1–123; FDNY borough
    dispatch names. Manhattan: Harlem, East Harlem, UWS, UES, Midtown,
    Chelsea, Village, LES, Chinatown, FiDi, Hell's Kitchen, Inwood,
    Washington Heights. Brooklyn: Bed-Stuy, Brownsville, East New York,
    Crown Heights, Flatbush, Bushwick, Williamsburg, Park Slope, Sunset
    Park, Bay Ridge, Coney Island, Boro Park, Midwood. Queens: Jamaica,
    Flushing, Astoria, LIC, Jackson Heights, Far Rockaway. Bronx: South
    Bronx, Mott Haven, Fordham, Pelham Bay. Staten Island: St George,
    Tottenville, New Dorp. Major roads: Broadway, FDR, BQE, Cross Bronx,
    Bruckner, LIE I-495, Grand Central, Henry Hudson, West Side Highway,
    Belt Parkway. Hospitals: Bellevue, Mount Sinai, NYU Langone,
    NewYork-Presbyterian, Jacobi, Lincoln, Kings County, Elmhurst,
    Maimonides, Methodist, Coney Island Hospital, Staten Island
    University.
