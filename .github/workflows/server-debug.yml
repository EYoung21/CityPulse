name: Server Debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Discover transcriber processes
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "=== Transcriber status ==="
            systemctl is-active philly-pulse-live

            echo ""
            echo "=== Recent transcriber logs (last 3 min) ==="
            journalctl -u philly-pulse-live --no-pager -n 30 --since "3 minutes ago"

            echo ""
            echo "=== Newest files in audio_clips ==="
            ls -lt /root/PhillyPulse/audio_clips/ | head -8

            echo ""
            echo "=== Total audio clips ==="
            echo "Total: $(ls /root/PhillyPulse/audio_clips/ | wc -l)"

            echo ""
            echo "=== Test serving a recent clip ==="
            NEWEST=$(ls -t /root/PhillyPulse/audio_clips/ | head -1)
            CLIP_ID="${NEWEST%.wav}"
            echo "Testing clip: $CLIP_ID"
            curl -s -o /dev/null -w "HTTP %{http_code} (%{size_download} bytes)\n" http://127.0.0.1:8765/api/audio/$CLIP_ID

            echo ""
            echo "=== API server logs (last 2 min, bridge-related) ==="
            journalctl -u philly-pulse-api --no-pager -n 30 --since "2 minutes ago" 2>/dev/null | grep -iE 'audio|clip|bridge|save' || echo "(no audio-related logs)"
