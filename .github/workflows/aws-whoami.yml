name: AWS whoami (identify the IAM user)

# One-off: prints which IAM user the repo's AWS_ACCESS_KEY_ID secret belongs to
# (so we attach SES permissions to the RIGHT user). sts:GetCallerIdentity needs
# no special permissions. Safe + read-only. Delete after use.

on:
  workflow_dispatch:

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - name: get-caller-identity
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws sts get-caller-identity --output json
