name: Server Cleanup (Disk Full Fix)

on:
  workflow_dispatch:
    inputs:
      keep_days:
        description: 'Keep processed clips newer than N days (0 = delete ALL old clips)'
        required: false
        default: '7'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Clean disk and restart services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          script: |
            KEEP_DAYS="${{ github.event.inputs.keep_days || '7' }}"

            echo "=== BEFORE cleanup ==="
            df -h /
            echo ""
            echo "audio_clips count: $(find /root/PhillyPulse/audio_clips/ -type f 2>/dev/null | wc -l)"
            echo "audio_clips_raw count: $(find /root/PhillyPulse/audio_clips_raw/ -type f 2>/dev/null | wc -l)"
            echo "audio_clips size: $(du -sh /root/PhillyPulse/audio_clips/ 2>/dev/null | cut -f1)"
            echo "audio_clips_raw size: $(du -sh /root/PhillyPulse/audio_clips_raw/ 2>/dev/null | cut -f1)"

            echo ""
            echo "=== Cleaning ALL raw clips (pre-processing duplicates) ==="
            find /root/PhillyPulse/audio_clips_raw/ -type f -delete 2>/dev/null || true
            echo "Done. Remaining: $(find /root/PhillyPulse/audio_clips_raw/ -type f 2>/dev/null | wc -l)"

            echo ""
            echo "=== Cleaning processed clips older than ${KEEP_DAYS} days ==="
            BEFORE=$(find /root/PhillyPulse/audio_clips/ -type f 2>/dev/null | wc -l)
            find /root/PhillyPulse/audio_clips/ -type f -mtime +${KEEP_DAYS} -delete 2>/dev/null || true
            AFTER=$(find /root/PhillyPulse/audio_clips/ -type f 2>/dev/null | wc -l)
            echo "Removed $((BEFORE - AFTER)) clips (kept $AFTER recent)"

            echo ""
            echo "=== Cleaning Python cache ==="
            find /root/PhillyPulse -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

            echo ""
            echo "=== Cleaning old log files ==="
            find /root/PhillyPulse -name "*.log" -mtime +7 -delete 2>/dev/null || true

            echo ""
            echo "=== Vacuuming journal logs ==="
            journalctl --vacuum-time=3d --vacuum-size=100M 2>/dev/null || true

            echo ""
            echo "=== AFTER cleanup ==="
            df -h /

            echo ""
            echo "=== Restarting services ==="
            systemctl restart philly-pulse-api
            systemctl restart philly-pulse-live
            sleep 5

            echo ""
            echo "=== Service status ==="
            systemctl is-active philly-pulse-api && echo "API: running" || echo "API: FAILED"
            systemctl is-active philly-pulse-live && echo "Transcriber: running" || echo "Transcriber: FAILED"

            echo ""
            echo "=== Health check ==="
            curl -s http://localhost:8765/api/health || echo "(health check failed)"
