name: Server Fix Runtime Config

on:
  workflow_dispatch:

jobs:
  fix-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-fix bucket env and disable invalid inhibitor key
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            ENV_FILE="/etc/philly-pulse.env"

            if [ -f "$ENV_FILE" ]; then
              # Load env so python bucket discovery can use service account/project info.
              set -a
              . "$ENV_FILE"
              set +a

              # Try to discover an actual accessible bucket for this Firebase project.
              DISCOVERED_BUCKET="$(python3 -c 'import json,os;pid=(os.getenv("FIREBASE_PROJECT_ID") or os.getenv("NEXT_PUBLIC_FIREBASE_PROJECT_ID") or "").strip();cp=(os.getenv("GOOGLE_APPLICATION_CREDENTIALS") or "").strip();pid=((json.load(open(cp, "r", encoding="utf-8")).get("project_id") or "").strip()) if (not pid and cp and os.path.isfile(cp)) else pid;print("" if not pid else (lambda out: out[0] if out else "")(sorted(set([b.name for b in __import__("google.cloud.storage", fromlist=["storage"]).Client(project=pid).list_buckets(max_results=50)]), key=lambda n:(0 if n.endswith(".appspot.com") else 1 if n.endswith(".firebasestorage.app") else 2, n))))' 2>/dev/null || true)"

              if [ -n "$DISCOVERED_BUCKET" ]; then
                if grep -q '^FIREBASE_STORAGE_BUCKET=' "$ENV_FILE"; then
                  sed -i "s|^FIREBASE_STORAGE_BUCKET=.*|FIREBASE_STORAGE_BUCKET=$DISCOVERED_BUCKET|" "$ENV_FILE" || true
                else
                  echo "FIREBASE_STORAGE_BUCKET=$DISCOVERED_BUCKET" >> "$ENV_FILE"
                fi
                echo "Using discovered FIREBASE_STORAGE_BUCKET=$DISCOVERED_BUCKET"
              else
                echo "WARNING: No Firebase bucket discovered; keeping existing FIREBASE_STORAGE_BUCKET value"
              fi

              # Current key returns 401; blank it so the service cleanly bypasses
              # inhibitor until a valid key is provided.
              if grep -q '^INHIBITOR_API_KEY=' "$ENV_FILE"; then
                sed -i 's/^INHIBITOR_API_KEY=.*/INHIBITOR_API_KEY=/' "$ENV_FILE" || true
              else
                echo 'INHIBITOR_API_KEY=' >> "$ENV_FILE"
              fi
            fi

            systemctl restart philly-pulse-api
            sleep 2

            echo "=== Runtime config status ==="
            systemctl is-active philly-pulse-api && echo "API: running" || echo "API: failed"
            grep -E '^(FIREBASE_STORAGE_BUCKET|INHIBITOR_API_KEY)=' "$ENV_FILE" \
              | sed 's/^INHIBITOR_API_KEY=.*/INHIBITOR_API_KEY=<set>/' \
              | sed 's/^INHIBITOR_API_KEY=$/INHIBITOR_API_KEY=<empty>/'
