name: Set Ingest Secret (close /api/ingest)

# Writes PULSE_INGEST_SECRET (a repo secret) into the Hetzner backend's
# /etc/philly-pulse.env and restarts the API so the public
# api.phlpulse.com/api/ingest + /api/audio/upload endpoints enforce the
# Bearer secret (enforce-when-set; see philly_pulse/server.py
# _verify_ingest_secret). The live ingestion pipeline runs on the Lambda
# loopback ingest-api (127.0.0.1:18080) — NOT this public endpoint — so
# locking the Hetzner public ingest has no effect on live capture. The
# script first prints a read-only inventory to confirm no local ingest
# client exists on this host, and (defensively) restarts any local
# pulse-live@* units that share this env file so they pick up the secret.
# Manual trigger only.

on:
  workflow_dispatch:

jobs:
  set-ingest-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Write PULSE_INGEST_SECRET into philly-pulse.env and restart API
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: PULSE_INGEST_SECRET
          command_timeout: 5m
          script: |
            set -e
            echo "=== READ-ONLY INVENTORY (confirm no local ingest client) ==="
            echo "--- active pulse/transcriber/ingest services on this host ---"
            systemctl list-units --type=service --state=active 2>/dev/null \
              | grep -iE 'pulse|transcrib|ingest|backfill|bridge' || echo "(none)"
            echo "--- local listeners ---"
            ss -ltnp 2>/dev/null | grep -iE 'uvicorn|python|gunicorn' || echo "(none)"
            echo "--- anything configured to POST to a local /api/ingest? ---"
            grep -rsanE 'BRIDGE_URL|PP_BRIDGE_URL|api/ingest' /etc/philly-pulse.env /root/PhillyPulse 2>/dev/null \
              | grep -ivE 'SECRET|KEY|PASS|PASSWORD' | head || echo "(none)"

            echo ""
            echo "=== SET SECRET (idempotent) ==="
            ENV_FILE="/etc/philly-pulse.env"
            touch "$ENV_FILE"
            chmod 640 "$ENV_FILE"
            sed -i '/^PULSE_INGEST_SECRET=/d' "$ENV_FILE"
            printf 'PULSE_INGEST_SECRET=%s\n' "$PULSE_INGEST_SECRET" >> "$ENV_FILE"

            echo "=== RESTART API ==="
            systemctl restart philly-pulse-api
            # Defensive: if any local transcriber units share this env file,
            # restart them so they also pick up the secret (no 401 mismatch).
            for unit in $(systemctl list-units 'pulse-live@*' --no-legend --plain 2>/dev/null | awk '{print $1}'); do
              echo "restarting local $unit to pick up PULSE_INGEST_SECRET"
              systemctl restart "$unit" || true
            done
            sleep 3

            echo ""
            echo "=== VERIFY ==="
            systemctl is-active philly-pulse-api && echo "API: running" || echo "API: FAILED"
            grep -q '^PULSE_INGEST_SECRET=.\+' "$ENV_FILE" && echo "PULSE_INGEST_SECRET: <set>" || echo "PULSE_INGEST_SECRET: <empty>"
            # Discover the local API port and confirm /api/ingest now rejects unauthenticated POSTs (expect 401).
            PORT=$(systemctl cat philly-pulse-api 2>/dev/null | grep -oiE -- '--port[ =]+[0-9]+' | grep -oE '[0-9]+' | head -1)
            [ -z "$PORT" ] && PORT=8765
            echo "local API port: $PORT"
            echo -n "GET /api/health -> "; curl -s -o /dev/null -w '%{http_code}\n' "http://127.0.0.1:$PORT/api/health" || echo "curl-failed"
            echo -n "POST /api/ingest (no auth, expect 401) -> "; curl -s -o /dev/null -w '%{http_code}\n' -X POST "http://127.0.0.1:$PORT/api/ingest" -H 'Content-Type: application/json' -d '{"text":"__probe__"}' || echo "curl-failed"
        env:
          PULSE_INGEST_SECRET: ${{ secrets.PULSE_INGEST_SECRET }}
