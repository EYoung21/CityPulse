name: Set Ingest Secret (close /api/ingest)

# Phase 2 of the coordinated rollout: every transcriber host (Lambda
# pulse-live@* drop-in + backfill env, Hetzner shares this env file) already
# carries PULSE_INGEST_SECRET and sends the Bearer header. This writes the SAME
# secret into the Hetzner API's /etc/philly-pulse.env and restarts the API so
# /api/ingest + /api/audio/upload enforce it. Because all posters already send
# the header (and allow-when-unset accepted them until now), there is no gap.
# Manual trigger only.

on:
  workflow_dispatch:

jobs:
  set-ingest-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Write PULSE_INGEST_SECRET into philly-pulse.env and restart API
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: PULSE_INGEST_SECRET
          command_timeout: 5m
          script: |
            set -e
            ENV_FILE="/etc/philly-pulse.env"
            touch "$ENV_FILE"; chmod 640 "$ENV_FILE"
            sed -i '/^PULSE_INGEST_SECRET=/d' "$ENV_FILE"
            printf 'PULSE_INGEST_SECRET=%s\n' "$PULSE_INGEST_SECRET" >> "$ENV_FILE"
            systemctl restart philly-pulse-api
            # Hetzner-local transcribers share this env file — restart so they pick up the secret too.
            for unit in $(systemctl list-units 'pulse-live@*' --no-legend --plain 2>/dev/null | awk '{print $1}'); do
              systemctl restart "$unit" || true
            done
            sleep 4
            systemctl is-active philly-pulse-api && echo "API: running" || echo "API: FAILED"
            grep -q '^PULSE_INGEST_SECRET=.\+' "$ENV_FILE" && echo "secret: set" || echo "secret: MISSING"
            # Recent ingest results from the API log: confirm authenticated posts (200) and that
            # un-authenticated attempts get 401. (No secret value printed.)
            echo "=== recent /api/ingest results (last 3 min) ==="
            journalctl -u philly-pulse-api.service --since "3 min ago" --no-pager 2>/dev/null | grep -E 'POST /api/ingest' | tail -8 || echo "(none yet)"
        env:
          PULSE_INGEST_SECRET: ${{ secrets.PULSE_INGEST_SECRET }}
