name: Server Fix Storage Bucket

on:
  workflow_dispatch:

jobs:
  fix-storage:
    runs-on: ubuntu-latest
    steps:
      - name: Detect storage bucket and restart API
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            ENV_FILE="/etc/philly-pulse.env"

            if [ ! -f "$ENV_FILE" ]; then
              echo "Missing $ENV_FILE"
              exit 1
            fi

            set -a
            . "$ENV_FILE"
            set +a

            DISCOVERED_BUCKET="$(python3 - <<'PY'
import json
import os

def pick_bucket(names):
    if not names:
        return ""
    ordered = sorted(
        set(names),
        key=lambda n: (
            0 if n.endswith(".appspot.com") else
            1 if n.endswith(".firebasestorage.app") else
            2,
            n,
        ),
    )
    return ordered[0]

project_id = (os.getenv("FIREBASE_PROJECT_ID") or os.getenv("NEXT_PUBLIC_FIREBASE_PROJECT_ID") or "").strip()
cred_path = (os.getenv("GOOGLE_APPLICATION_CREDENTIALS") or "").strip()
if not project_id and cred_path and os.path.isfile(cred_path):
    try:
        with open(cred_path, "r", encoding="utf-8") as f:
            project_id = (json.load(f).get("project_id") or "").strip()
    except Exception:
        pass

if not project_id:
    print("")
    raise SystemExit(0)

try:
    from google.cloud import storage
    client = storage.Client(project=project_id)
    print(pick_bucket([b.name for b in client.list_buckets(max_results=50)]))
except Exception:
    print("")
PY
)"

            if [ -z "$DISCOVERED_BUCKET" ]; then
              echo "No bucket discovered; leaving FIREBASE_STORAGE_BUCKET unchanged"
            elif grep -q '^FIREBASE_STORAGE_BUCKET=' "$ENV_FILE"; then
              sed -i "s|^FIREBASE_STORAGE_BUCKET=.*|FIREBASE_STORAGE_BUCKET=$DISCOVERED_BUCKET|" "$ENV_FILE"
              echo "Updated FIREBASE_STORAGE_BUCKET=$DISCOVERED_BUCKET"
            else
              echo "FIREBASE_STORAGE_BUCKET=$DISCOVERED_BUCKET" >> "$ENV_FILE"
              echo "Added FIREBASE_STORAGE_BUCKET=$DISCOVERED_BUCKET"
            fi

            systemctl restart philly-pulse-api
            sleep 2
            systemctl is-active philly-pulse-api
            grep '^FIREBASE_STORAGE_BUCKET=' "$ENV_FILE" || true
