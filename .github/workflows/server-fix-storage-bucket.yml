name: Server Fix Storage Bucket

on:
  workflow_dispatch:

jobs:
  fix-storage:
    runs-on: ubuntu-latest
    steps:
      - name: Detect storage bucket and restart API
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            ENV_FILE="/etc/philly-pulse.env"

            if [ ! -f "$ENV_FILE" ]; then
              echo "Missing $ENV_FILE"
              exit 1
            fi

            set -a
            . "$ENV_FILE"
            set +a

            DISCOVERED_BUCKET="$(python3 -c 'import json,os;pid=(os.getenv("FIREBASE_PROJECT_ID") or os.getenv("NEXT_PUBLIC_FIREBASE_PROJECT_ID") or "").strip();cp=(os.getenv("GOOGLE_APPLICATION_CREDENTIALS") or "").strip();pid=((json.load(open(cp, "r", encoding="utf-8")).get("project_id") or "").strip()) if (not pid and cp and os.path.isfile(cp)) else pid;print("" if not pid else (lambda c: (lambda names: ((lambda ordered: ordered[0] if ordered else "")(sorted(set(names), key=lambda n:(0 if n.endswith(".appspot.com") else 1 if n.endswith(".firebasestorage.app") else 2, n)))))(([b.name for b in c.list_buckets(max_results=50)] or ([c.create_bucket(f\"{pid}.appspot.com\", location=\"us-central1\").name] if True else []))))(__import__(\"google.cloud.storage\", fromlist=[\"storage\"]).Client(project=pid))))' 2>/dev/null || true)"

            if [ -z "$DISCOVERED_BUCKET" ]; then
              echo "No bucket discovered; leaving FIREBASE_STORAGE_BUCKET unchanged"
            elif grep -q '^FIREBASE_STORAGE_BUCKET=' "$ENV_FILE"; then
              sed -i "s|^FIREBASE_STORAGE_BUCKET=.*|FIREBASE_STORAGE_BUCKET=$DISCOVERED_BUCKET|" "$ENV_FILE"
              echo "Updated FIREBASE_STORAGE_BUCKET=$DISCOVERED_BUCKET"
            else
              echo "FIREBASE_STORAGE_BUCKET=$DISCOVERED_BUCKET" >> "$ENV_FILE"
              echo "Added FIREBASE_STORAGE_BUCKET=$DISCOVERED_BUCKET"
            fi

            systemctl restart philly-pulse-api
            sleep 2
            systemctl is-active philly-pulse-api
            grep '^FIREBASE_STORAGE_BUCKET=' "$ENV_FILE" || true
