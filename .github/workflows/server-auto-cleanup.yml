name: Server Auto-Cleanup (Daily)

on:
  schedule:
    # Run twice daily at 06:00 and 18:00 UTC (2 AM / 2 PM ET)
    - cron: '0 6,18 * * *'
  workflow_dispatch:

jobs:
  auto-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Clean old clips and temp files
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          script: |
            echo "=== Disk usage before ==="
            df -h / | tail -1

            echo ""
            echo "=== Removing ALL raw clips (no longer needed) ==="
            RAW_DIR="/root/PhillyPulse/audio_clips_raw"
            if [ -d "$RAW_DIR" ]; then
              BEFORE=$(find "$RAW_DIR" -type f 2>/dev/null | wc -l)
              find "$RAW_DIR" -type f -delete 2>/dev/null || true
              echo "Removed $BEFORE raw clips (no longer saving raw audio)"
            fi

            echo ""
            echo "=== Removing orphan clips (not referenced by any incident) ==="
            CLIPS_DIR="/root/PhillyPulse/audio_clips"
            DB_PATH="/root/PhillyPulse/philly_pulse/data/philly_pulse.db"
            if [ -d "$CLIPS_DIR" ] && [ -f "$DB_PATH" ]; then
              # Get all clip IDs referenced by incidents in the database
              REFERENCED=$(sqlite3 "$DB_PATH" "SELECT DISTINCT audio_clip FROM incidents WHERE audio_clip IS NOT NULL AND audio_clip != ''" 2>/dev/null)
              if [ -n "$REFERENCED" ]; then
                # Create a temp file with referenced clip filenames
                echo "$REFERENCED" | sed 's/$/.wav/' > /tmp/referenced_clips.txt
                REF_COUNT=$(wc -l < /tmp/referenced_clips.txt)
                echo "Incidents reference $REF_COUNT audio clips in the database"

                # List all clip files on disk, find orphans, and delete them
                TOTAL_ON_DISK=$(find "$CLIPS_DIR" -name "*.wav" -type f 2>/dev/null | wc -l)
                ORPHAN_COUNT=0
                find "$CLIPS_DIR" -name "*.wav" -type f -printf "%f\n" 2>/dev/null | while read -r fname; do
                  if ! grep -qxF "$fname" /tmp/referenced_clips.txt; then
                    rm -f "$CLIPS_DIR/$fname"
                    ORPHAN_COUNT=$((ORPHAN_COUNT + 1))
                  fi
                done
                AFTER=$(find "$CLIPS_DIR" -name "*.wav" -type f 2>/dev/null | wc -l)
                echo "Had $TOTAL_ON_DISK clips on disk, now $AFTER (removed $((TOTAL_ON_DISK - AFTER)) orphans)"
                rm -f /tmp/referenced_clips.txt
              else
                echo "No referenced clips found in DB (or DB query failed)"
              fi
            fi

            echo ""
            echo "=== Removing referenced clips older than 150 days (5 months) ==="
            if [ -d "$CLIPS_DIR" ]; then
              BEFORE=$(find "$CLIPS_DIR" -type f 2>/dev/null | wc -l)
              find "$CLIPS_DIR" -type f -mtime +150 -delete 2>/dev/null || true
              AFTER=$(find "$CLIPS_DIR" -type f 2>/dev/null | wc -l)
              echo "Removed $((BEFORE - AFTER)) clips older than 5 months (kept $AFTER)"
            fi

            echo ""
            echo "=== Cleaning Python cache and old logs ==="
            find /root/PhillyPulse -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
            find /root/PhillyPulse -name "*.log" -mtime +7 -delete 2>/dev/null || true
            journalctl --vacuum-time=3d --vacuum-size=100M 2>/dev/null || true

            echo ""
            echo "=== Disk usage after ==="
            df -h / | tail -1
