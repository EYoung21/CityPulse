name: Server Auto-Cleanup (Daily)

on:
  schedule:
    # Run twice daily at 06:00 and 18:00 UTC (2 AM / 2 PM ET)
    - cron: '0 6,18 * * *'
  workflow_dispatch:

jobs:
  auto-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Clean old clips and temp files
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          script: |
            echo "=== Disk usage before ==="
            df -h / | tail -1

            echo ""
            echo "=== Removing ALL raw clips (no longer needed) ==="
            RAW_DIR="/root/PhillyPulse/audio_clips_raw"
            if [ -d "$RAW_DIR" ]; then
              BEFORE=$(find "$RAW_DIR" -type f 2>/dev/null | wc -l)
              find "$RAW_DIR" -type f -delete 2>/dev/null || true
              echo "Removed $BEFORE raw clips"
            fi

            echo ""
            echo "=== Removing orphan clips (not referenced by any incident) ==="
            CLIPS_DIR="/root/PhillyPulse/audio_clips"
            cd /root/PhillyPulse
            # Use Python + Firestore to get referenced clip IDs, then purge orphans
            /root/PhillyPulse/venv/bin/python3 -c "
            import os, sys
            os.environ['GOOGLE_APPLICATION_CREDENTIALS'] = '/root/firebase-sa.json'
            try:
                from philly_pulse.firestore_store import _ensure_client
                db = _ensure_client()
                # Get all clip IDs referenced by incidents
                referenced = set()
                for doc in db.collection('incidents').select(['audio_clip']).stream():
                    clip = (doc.to_dict() or {}).get('audio_clip')
                    if clip:
                        referenced.add(clip)
                print(f'Incidents reference {len(referenced)} audio clips in Firestore')

                # List all clips on disk
                clips_dir = '/root/PhillyPulse/audio_clips'
                on_disk = set()
                for f in os.listdir(clips_dir):
                    if f.endswith('.wav'):
                        on_disk.add(f[:-4])  # strip .wav

                orphans = on_disk - referenced
                print(f'On disk: {len(on_disk)}, Referenced: {len(referenced)}, Orphans: {len(orphans)}')

                # Delete orphans
                deleted = 0
                for clip_id in orphans:
                    path = os.path.join(clips_dir, f'{clip_id}.wav')
                    try:
                        os.remove(path)
                        deleted += 1
                    except OSError:
                        pass
                print(f'Deleted {deleted} orphan clips')
            except Exception as e:
                print(f'Orphan cleanup failed: {e}', file=sys.stderr)
                print('Falling back to age-based cleanup only')
            " 2>&1

            echo ""
            echo "=== Removing clips older than 150 days (5 months) ==="
            if [ -d "$CLIPS_DIR" ]; then
              BEFORE=$(find "$CLIPS_DIR" -type f 2>/dev/null | wc -l)
              find "$CLIPS_DIR" -type f -mtime +150 -delete 2>/dev/null || true
              AFTER=$(find "$CLIPS_DIR" -type f 2>/dev/null | wc -l)
              echo "Removed $((BEFORE - AFTER)) clips older than 5 months (kept $AFTER)"
            fi

            echo ""
            echo "=== Cleaning Python cache and old logs ==="
            find /root/PhillyPulse -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
            find /root/PhillyPulse -name "*.log" -mtime +7 -delete 2>/dev/null || true
            journalctl --vacuum-time=3d --vacuum-size=100M 2>/dev/null || true

            echo ""
            echo "=== Disk usage after ==="
            df -h / | tail -1
