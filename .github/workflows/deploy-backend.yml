name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "philly_pulse/**"
      - "radiotranscriber.py"
      - "multi_transcriber.py"
      - "config.yaml"
      - "requirements-philly-pulse.txt"
      - "scripts/deploy-backend-hetzner.sh"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GITHUB_TOKEN
          script: |
            /root/deploy.sh
            # Keep /root/deploy.sh in sync with the repo copy
            cp /root/PhillyPulse/scripts/deploy-backend-hetzner.sh /root/deploy.sh
            # Restart the live transcriber so it picks up updated code
            systemctl restart philly-pulse-live
            sleep 2
            systemctl is-active philly-pulse-live || echo "WARNING: philly-pulse-live failed to start"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
