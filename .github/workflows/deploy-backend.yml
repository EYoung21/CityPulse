name: Deploy Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "philly_pulse/**"
      - "config.yaml"
      - "cities/**"
      - "requirements-philly-pulse.txt"
      - "scripts/deploy-backend-hetzner.sh"
      - "scripts/setup-multi-city.sh"
      - "systemd/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GITHUB_TOKEN
          script: |
            /root/deploy.sh
            # Keep /root/deploy.sh in sync. If this push changed the deploy
            # script, run the new copy once immediately; otherwise a deploy
            # change would not take effect until the following push.
            if ! cmp -s /root/PhillyPulse/scripts/deploy-backend-hetzner.sh /root/deploy.sh; then
              cp /root/PhillyPulse/scripts/deploy-backend-hetzner.sh /root/deploy.sh
              chmod 700 /root/deploy.sh
              /root/deploy.sh
            fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
