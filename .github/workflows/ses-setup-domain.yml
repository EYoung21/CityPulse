name: SES setup domains (all city domains)

# Creates SES domain identities with Easy DKIM for every CityPulse city domain
# and prints the DKIM CNAME records to add in GoDaddy. Also submits the
# account-level production-access (sandbox-exit) request once. Uses the existing
# AWS secrets (algoarena-bedrock, which now has the citypulse-ses policy).
# Manual trigger; safe to re-run (idempotent per domain).

on:
  workflow_dispatch:

env:
  # All production city domains (all on GoDaddy). Add new cities here.
  DOMAINS: "423pulse.com sfopulse.com phlpulse.com newyorkcitypulse.com"

jobs:
  ses-setup:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Create identities + print DKIM records for every domain
        run: |
          for DOMAIN in $DOMAINS; do
            if ! aws sesv2 get-email-identity --email-identity "$DOMAIN" >/dev/null 2>&1; then
              aws sesv2 create-email-identity --email-identity "$DOMAIN" >/dev/null
              echo ">>> Created SES identity for $DOMAIN"
            else
              echo ">>> SES identity for $DOMAIN already exists"
            fi
            echo "===== DKIM CNAME RECORDS for $DOMAIN (add these 3 in GoDaddy) ====="
            TOKENS=$(aws sesv2 get-email-identity --email-identity "$DOMAIN" \
                      --query 'DkimAttributes.Tokens' --output text)
            for t in $TOKENS; do
              echo "[$DOMAIN] HOST: ${t}._domainkey   TYPE: CNAME   VALUE: ${t}.dkim.amazonses.com"
            done
            STATUS=$(aws sesv2 get-email-identity --email-identity "$DOMAIN" \
                      --query '{Verified:VerifiedForSendingStatus,Dkim:DkimAttributes.Status}' --output json)
            echo "[$DOMAIN] status: $STATUS"
            echo
          done

      - name: Request production access (account-level, sandbox exit) — best effort
        continue-on-error: true
        run: |
          aws sesv2 put-account-details \
            --production-access-enabled \
            --mail-type TRANSACTIONAL \
            --website-url "https://423pulse.com" \
            --use-case-description "Transactional newsworthy-incident alert emails to opted-in CityPulse Newsroom users across our city sites (423pulse, sfopulse, phlpulse, newyorkcitypulse). Recipients explicitly subscribe in-app and can unsubscribe anytime; no purchased lists. We use the SES suppression list + SNS bounce/complaint notifications. Low volume." \
            --additional-contact-email-addresses "eliyoung4now@gmail.com" \
            --contact-language EN \
          && echo "Production access requested (AWS reviews ~24h)" \
          || echo "Production-access request skipped/failed (may already be requested or granted)"
