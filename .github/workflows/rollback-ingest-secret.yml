name: Rollback Ingest Secret (reopen accept-anything)

# Removes PULSE_INGEST_SECRET from the Hetzner backend's /etc/philly-pulse.env
# and restarts the API, reverting /api/ingest + /api/audio/upload to
# allow-when-unset. Needed because the Lambda live transcribers
# (philly/nyc/sf/chattanooga/philly2) post to the PUBLIC api.phlpulse.com
# WITHOUT the secret, so enforcing it blocked the main live-feed ingest path.
# Closing the endpoint for real requires rolling the secret out to every
# transcriber host first. Manual trigger only.

on:
  workflow_dispatch:

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Remove PULSE_INGEST_SECRET and restart API
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            ENV_FILE="/etc/philly-pulse.env"
            sed -i '/^PULSE_INGEST_SECRET=/d' "$ENV_FILE"
            systemctl restart philly-pulse-api
            # Restart the Hetzner-local transcribers too so their env no longer
            # carries the (now-removed) secret — they post un-authenticated,
            # which allow-when-unset accepts.
            for unit in $(systemctl list-units 'pulse-live@*' --no-legend --plain 2>/dev/null | awk '{print $1}'); do
              systemctl restart "$unit" || true
            done
            sleep 3
            systemctl is-active philly-pulse-api && echo "API: running" || echo "API: FAILED"
            grep -q '^PULSE_INGEST_SECRET=' "$ENV_FILE" && echo "secret: STILL PRESENT (bad)" || echo "secret: removed"
            PORT=$(systemctl cat philly-pulse-api 2>/dev/null | grep -oiE -- '--port[ =]+[0-9]+' | grep -oE '[0-9]+' | head -1); [ -z "$PORT" ] && PORT=8765
            echo -n "POST /api/ingest (no auth, expect 200/422 now, NOT 401) -> "
            curl -s -o /dev/null -w '%{http_code}\n' -X POST "http://127.0.0.1:$PORT/api/ingest" -H 'Content-Type: application/json' -d '{"text":""}' || echo "curl-failed"
