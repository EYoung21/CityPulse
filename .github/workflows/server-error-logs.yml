name: Server Error Logs

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Get API error details
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "=== API service status ==="
            systemctl status philly-pulse-api --no-pager || true

            echo ""
            echo "=== Recent API ERROR/traceback logs (last 200 lines) ==="
            journalctl -u philly-pulse-api --no-pager -n 200 --since "1 hour ago" 2>/dev/null \
              | grep -A5 -i 'error\|traceback\|exception\|500' | tail -100

            echo ""
            echo "=== Full recent API logs (last 50 lines) ==="
            journalctl -u philly-pulse-api --no-pager -n 50

            echo ""
            echo "=== Transcriber recent logs (last 30 lines) ==="
            journalctl -u philly-pulse-live --no-pager -n 30

            echo ""
            echo "=== philly-pulse-api service file ==="
            cat /etc/systemd/system/philly-pulse-api.service 2>/dev/null || echo "(not found)"

            echo ""
            echo "=== env file ==="
            cat /etc/philly-pulse.env 2>/dev/null | sed 's/=.*/=***/' || echo "(not found)"

            echo ""
            echo "=== philly-pulse-live service file ==="
            cat /etc/systemd/system/philly-pulse-live.service 2>/dev/null || echo "(not found)"

            echo ""
            echo "=== Disk space ==="
            df -h /
