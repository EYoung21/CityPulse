name: Server Check OOM + Transcriber Health

# Read-only probe: are the pulse-live@<city> transcribers OOM-killed
# inside their 400M cgroup? Surfaces dmesg/journalctl evidence + recent
# memory.peak per service so we can decide whether to raise the cap.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect cgroup memory + OOM history
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 3m
          script: |
            set +e
            echo "######################################################"
            echo "# 1. Current memory + swap"
            echo "######################################################"
            free -h | head -3
            echo ""

            echo "######################################################"
            echo "# 2. Per-transcriber: status, restart count, memory.peak"
            echo "######################################################"
            for city in sf nyc philly chattanooga; do
              echo "--- pulse-live@${city} ---"
              systemctl show "pulse-live@${city}" \
                -p ActiveState,SubState,NRestarts,ExecMainStartTimestamp,MemoryMax 2>/dev/null
              echo -n "  current memory.current: "
              cat "/sys/fs/cgroup/system.slice/system-pulse\\x2dlive.slice/pulse-live@${city}.service/memory.current" 2>/dev/null
              echo -n "  peak    memory.peak:    "
              cat "/sys/fs/cgroup/system.slice/system-pulse\\x2dlive.slice/pulse-live@${city}.service/memory.peak" 2>/dev/null
              echo -n "  oom_kill count:         "
              awk '/oom_kill /{print $2}' "/sys/fs/cgroup/system.slice/system-pulse\\x2dlive.slice/pulse-live@${city}.service/memory.events" 2>/dev/null
              echo ""
            done

            echo "######################################################"
            echo "# 3. Last 15 min journal — OOM kills (kernel level)"
            echo "######################################################"
            journalctl -k --since '15 min ago' --no-pager 2>/dev/null \
              | grep -iE 'oom|out of memory|killed process' | tail -20

            echo ""
            echo "######################################################"
            echo "# 4. Recent pulse-live restarts (last 15 min)"
            echo "######################################################"
            for city in sf nyc philly chattanooga; do
              echo "--- pulse-live@${city} restarts ---"
              journalctl -u "pulse-live@${city}" --since '15 min ago' --no-pager 2>/dev/null \
                | grep -E 'Started|Stopped|killed|Main process exited' | tail -8
            done

            echo ""
            echo "######################################################"
            echo "# 5. API health + ingest rate (last 5 min)"
            echo "######################################################"
            systemctl is-active philly-pulse-api
            journalctl -u philly-pulse-api --since '5 min ago' --no-pager 2>/dev/null \
              | grep -cE 'POST /api/ingest' \
              | xargs -I{} echo "  /api/ingest POSTs in last 5 min: {}"
            timeout 4 curl -sS -m 4 http://127.0.0.1:8765/api/health | head -c 200
            echo ""
